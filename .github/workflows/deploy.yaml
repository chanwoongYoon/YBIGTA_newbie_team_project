#깃허브 작업 이름
name: Deploy Project

#깃허브 액션 작동 트리거
on:
    push:
        branches:
            - main

#최소 작업 단위
jobs:
    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest

        steps:
            - name: 1. 깃허브 코드 가져오기(Checkout)
              uses: actions/checkout@v3

            - name: 2. 도커 허브 로그인
              uses: docker/login-action@v2
              with:
                username: ${{secrets.DOCKER_USERNAME}}
                password: ${{secrets.DOCKER_PASSWORD}}

            - name: 3. 도커 이미지 빌드 및 푸시
              uses: docker/build-push-action@v4
              with:
                context: .
                push: true
                tags: ${{ secrets.DOCKER_USERNAME }}/my-app:latest

    deploy:
        name: Deploy to EC2
        needs: build-and-push
        runs-on: ubuntu-latest

        steps:
            - name: EC2 접속 및 도커 컨테이너 실행
              uses: appleboy/ssh-action@v1.0.0
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ubuntu
                key: ${{ secrets.EC2_KEY }}
                script: |
                    sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
                    sudo docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest

                    sudo docker stop my-app || true
                    sudo docker rm my-app || true

                    sudo docker run -d -p 8000:8000 --name my-app ${{ secrets.DOCKER_USERNAME }}/my-app:latest
